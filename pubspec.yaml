name: nova_app
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.9.2
dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  firebase_core: ^4.15.0
  firebase_auth: ^6.6.0
  google_sign_in: ^7.2.0
  cloud_firestore: ^6.9.0
  firebase_storage: ^13.5.0
  flutter_riverpod: ^3.3.2
  go_router: ^17.2.3
  google_maps_flutter: ^2.14.2
  table_calendar: ^3.2.1
  share_plus: ^12.0.2
  fpdart: ^1.1.1 
  flutter_localizations:
    sdk: flutter
  geocoding: ^5.0.0
  firebase_crashlytics: ^5.4.0
  firebase_performance: ^0.11.6
  firebase_analytics: ^12.6.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^5.0.0
  mocktail: ^1.0.4   

flutter:

  uses-material-design: true

  fonts:
    - family: Montserrat
      fonts:
        - asset: assets/fonts/Montserrat-Regular.ttf
          weight: 400
        - asset: assets/fonts/Montserrat-Medium.ttf
          weight: 500
        - asset: assets/fonts/Montserrat-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Montserrat-Bold.ttf
          weight: 700
        - asset: assets/fonts/Montserrat-ExtraBold.ttf
          weight: 800
